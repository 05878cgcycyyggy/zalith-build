name: Build Zalith APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache: false

      - name: Clean workspace (disable build cache)
        run: |
          rm -rf .gradle ZalithLauncher/build
          ./gradlew clean --no-daemon || true

      - name: Increase build memory for CI (fix Kotlin OOM)
        run: |
          # 提高 Gradle 与 Kotlin 编译器堆内存，避免 GC overhead limit exceeded
          # Actions runner 约 7GB 内存，Gradle 3G + Kotlin 3G = 6G 在安全范围内
          sed -i 's/org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=512m -XX:+UseParallelGC/' gradle.properties
          sed -i 's/kotlin.daemon.jvmargs=.*/kotlin.daemon.jvmargs=-Xmx3g/' gradle.properties
          # 移除 Termux 专用 AAPT2 路径，让 CI 使用标准 AAPT2（否则依赖 AAR 资源编译失败）
          sed -i '/android.aapt2FromMavenOverride/d' gradle.properties
          echo "=== 调整后 gradle.properties ==="
          cat gradle.properties

      - name: Build Debug APK
        run: ./gradlew :ZalithLauncher:assembleDebug --no-daemon --rerun-tasks

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZalithLauncher-Debug
          path: ZalithLauncher/build/outputs/apk/debug/*.apk
