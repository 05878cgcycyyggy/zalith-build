name: Build Zalith APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Rust toolchain for PetLib
        run: |
          set -e
          # 安装 Rust 稳定版工具链
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
          # 添加四个 Android 交叉编译目标
          rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android
          # 安装 cargo-ndk（若缓存命中则跳过）
          if ! cargo ndk --version >/dev/null 2>&1; then
            cargo install cargo-ndk --locked
          fi
          cargo ndk --version
          rustc --version

      - name: Configure Android NDK for cargo-ndk
        run: |
          set -e
          # 解析 CI runner 上已安装的 NDK 路径并写入环境变量
          NDK_DIR=""
          if [ -n "$ANDROID_NDK_LATEST_HOME" ] && [ -d "$ANDROID_NDK_LATEST_HOME" ]; then
            NDK_DIR="$ANDROID_NDK_LATEST_HOME"
          elif [ -n "$ANDROID_NDK_HOME" ] && [ -d "$ANDROID_NDK_HOME" ]; then
            NDK_DIR="$ANDROID_NDK_HOME"
          else
            NDK_DIR="$(ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null | sort -V | tail -n 1)"
          fi
          if [ -z "$NDK_DIR" ] || [ ! -d "$NDK_DIR" ]; then
            echo "No Android NDK found; installing via sdkmanager"
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.0.12077973" >/dev/null
            NDK_DIR="$ANDROID_HOME/ndk/27.0.12077973"
          fi
          echo "Using Android NDK: $NDK_DIR"
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK_DIR" >> "$GITHUB_ENV"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache: false

      - name: Clean workspace (disable build cache)
        run: |
          rm -rf .gradle ZalithLauncher/build
          ./gradlew clean --no-daemon || true

      - name: Increase build memory for CI (fix Kotlin OOM)
        run: |
          # 提高 Gradle 与 Kotlin 编译器堆内存，避免 GC overhead limit exceeded
          # Actions runner 约 7GB 内存，Gradle 3G + Kotlin 3G = 6G 在安全范围内
          sed -i 's/org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=512m -XX:+UseParallelGC/' gradle.properties
          sed -i 's/kotlin.daemon.jvmargs=.*/kotlin.daemon.jvmargs=-Xmx3g/' gradle.properties
          # 移除 Termux 专用 AAPT2 路径，让 CI 使用标准 AAPT2（否则依赖 AAR 资源编译失败）
          sed -i '/android.aapt2FromMavenOverride/d' gradle.properties
          echo "=== 调整后 gradle.properties ==="
          cat gradle.properties

      - name: Assemble bundled modpack archive
        run: |
          mkdir -p ZalithLauncher/src/main/assets/modpack
          cat modpack_parts/game-instance.zip.part-* > ZalithLauncher/src/main/assets/modpack/game-instance.zip
          echo "13d40f0ea9eeeb7adcdc9f94dd0d19362347990013c1b9c7204a67cb00a3895f  ZalithLauncher/src/main/assets/modpack/game-instance.zip" | sha256sum -c -
          ls -lh ZalithLauncher/src/main/assets/modpack/game-instance.zip

      - name: Build Debug APK
        run: ./gradlew :ZalithLauncher:assembleDebug --no-daemon --rerun-tasks

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZalithLauncher-Debug
          path: ZalithLauncher/build/outputs/apk/debug/*.apk
