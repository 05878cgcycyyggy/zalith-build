name: Build Zalith APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache: false

      - name: Clean workspace (disable build cache)
        run: |
          rm -rf .gradle ZalithLauncher/build
          ./gradlew clean --no-daemon || true

      - name: Build Debug APK
        run: ./gradlew :ZalithLauncher:assembleDebug --no-daemon --rerun-tasks

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZalithLauncher-Debug
          path: ZalithLauncher/build/outputs/apk/debug/*.apk
